# 日志配置
logging:
  level:
    root: INFO
    com.steam: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n'
# 启用定时任务
task:
  enabled: true
  hot-sale:
    interval: 900000